name: Build and release (Linux)

# Every push and pull request builds the AppImage and keeps it as an artifact.
# A tag v* (for example v1.0.0) also publishes it as a GitHub release.
# The job compiles and packages only: CI has no game and no GPU.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Debian 13: SDL3 is packaged and its glibc (2.41) sets how old a system the AppImage runs on.
    container: debian:13
    steps:
      # git before the checkout, so that it fetches the submodules.
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          bash packaging/linux/install-deps.sh
          git config --global --add safe.directory '*'

      # SDL3 and FFmpeg for the AppImage (no hard links to X11, VA-API, codecs ...).
      - name: Build SDL3 and FFmpeg
        run: bash packaging/linux/build-libs.sh

      - name: Build
        run: PKG_CONFIG_PATH="$PWD/out/libs/lib/pkgconfig" bash build.sh

      - name: Package
        run: bash packaging/linux/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: gravityrush-linux
          path: dist/GravityRush-PC-*-Linux-x86_64.AppImage*
          if-no-files-found: error

  # The AppImage is published as a GitHub release.
  linux-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gravityrush-linux
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/GravityRush-PC-*-Linux-x86_64.AppImage*
          generate_release_notes: true
          body: |
            **Gravity Rush Remastered (PS4, CUSA01113) for PC — Linux AppImage.**
            Unofficial build; no game files are included: you need your own
            copy as an unpacked game folder (eboot.bin, sce_module, sce_sys).

            1. Download the `.AppImage`, make it executable and run it.
            2. Game page: **Browse…** to the folder with `eboot.bin`.
            3. Press **PLAY**.

            Needs x86-64 Linux with glibc 2.41 or newer and a Vulkan 1.3 GPU.
