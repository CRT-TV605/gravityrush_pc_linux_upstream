name: Build and release (Windows, Linux)

# Every push and pull request builds the port and keeps gravityrush-windows.zip and the Linux
# AppImage as artifacts. A tag v* (for example v1.0.0) also publishes them as a GitHub release.
# The Linux job compiles and packages only: CI has no game and no GPU.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # PyInstaller freezes the launcher with a python.org-style Windows Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          path-type: inherit
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3 mingw-w64-clang-x86_64-fmt mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map mingw-w64-clang-x86_64-xxhash mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis mingw-w64-clang-x86_64-spirv-tools mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross

      - name: Build
        env:
          # Newer CLANG64 libc++ no longer pulls these in transitively for some third-party code.
          CXXFLAGS: -include cstdlib -include cstdio -include cwchar -include cmath -include new
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: '*'
        run: |
          export MSYS2_ROOT="$(cygpath -u "$(cygpath -m /)")"
          bash build.sh

      - name: Package
        run: |
          export MSYS2_ROOT="$(cygpath -u "$(cygpath -m /)")"
          export WINPYTHON="$(cygpath -u "$pythonLocation")/python.exe"
          bash packaging/windows/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: gravityrush-windows
          path: dist/gravityrush-windows.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gravityrush-windows.zip
          generate_release_notes: true
          body: |
            **Gravity Rush Remastered (PS4, CUSA01113) for PC.** No game files are included: you need your own
            copy (unpacked folder or fake .pkg).

            1. Download `gravityrush-windows.zip`, extract it (not inside the zip).
            2. Open `GravityRush.exe` (unsigned: More info, Run anyway).
            3. Game page: **Choose .pkg…** to install from your package, or **Browse…** to the
               folder with `eboot.bin`.
            4. Press **PLAY**.

            Needs Windows 10/11 64-bit and a Vulkan 1.3 GPU. See README-Windows.txt in the zip.

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Debian 13: SDL3 is packaged and its glibc (2.41) sets how old a system the AppImage runs on.
    container: debian:13
    steps:
      # git before the checkout, so that it fetches the submodules.
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          bash packaging/linux/install-deps.sh
          git config --global --add safe.directory '*'

      # SDL3 and FFmpeg for the AppImage (no hard links to X11, VA-API, codecs ...).
      - name: Build SDL3 and FFmpeg
        run: bash packaging/linux/build-libs.sh

      - name: Build
        run: PKG_CONFIG_PATH="$PWD/out/libs/lib/pkgconfig" bash build.sh

      - name: Package
        run: bash packaging/linux/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: gravityrush-linux
          path: |
            dist/GravityRush-PC-*-Linux-x86_64.AppImage
            dist/GravityRush-PC-*-Linux-x86_64.AppImage.sha256
          if-no-files-found: error

  # The AppImage joins the release the Windows job publishes.
  linux-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gravityrush-linux
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GravityRush-PC-*-Linux-x86_64.AppImage
            dist/GravityRush-PC-*-Linux-x86_64.AppImage.sha256
